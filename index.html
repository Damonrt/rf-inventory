<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF Inventory</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#0f766e;--warn:#92400e;--scrap:#991b1b;--sidebar:#ffffff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1500px;margin:auto;padding:16px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:22px;margin:0}.brand-actions{display:flex;align-items:center;gap:10px}.count{font-size:13px;color:var(--muted)}.lang-btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;cursor:pointer}.lang-btn:hover{background:#f8fafc}
.app{max-width:1500px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;padding:18px 16px 32px}.sidebar{position:sticky;top:82px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--sidebar);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.side-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 0 9px}.side-heading:not(:first-child){margin-top:18px}.side-title{font-weight:800;font-size:14px}.side-actions{display:flex;gap:5px}.side-action{min-width:30px;height:26px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);font-size:14px;font-weight:800;line-height:1;cursor:pointer}.side-action:hover{background:#f8fafc;border-color:#94a3b8}.drop-list{display:grid;gap:7px}.dropzone{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;padding:8px 10px;border:1px dashed #cbd5e1;border-radius:9px;background:#f8fafc;font-size:13px;cursor:pointer;transition:.15s}.dropzone:hover{border-color:#64748b;background:#f1f5f9}.dropzone.dragover{border-color:#2563eb;background:#dbeafe;transform:translateX(3px)}.dropzone.active{border-style:solid;border-color:#111827;background:#eef2ff}.dropzone .n{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 6px}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.content{min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.15s}.card.dragging{opacity:.45;transform:scale(.98)}
.photo{aspect-ratio:4/3;background:#eef1f4;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab}.photo:active{cursor:grabbing}.photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}.body{padding:14px}.topline{display:flex;align-items:center;gap:8px}.id{font-weight:700;font-size:13px;letter-spacing:.04em}.loc{font-size:12px;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#3730a3;font-weight:700}.title{font-weight:700;font-size:17px;line-height:1.35;margin:10px 0 8px}.meta{display:grid;grid-template-columns:88px 1fr;gap:6px 8px;font-size:13px}.meta dt{color:var(--muted)}.meta dd{margin:0;word-break:break-word}.editable{cursor:text;text-decoration:underline dotted #94a3b8;text-underline-offset:3px}.editable:hover{color:#111827;background:#f8fafc}.qty-wrap{display:flex;align-items:center;gap:8px;margin-top:12px}.qty-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:20px;line-height:1;cursor:pointer}.qty-btn:hover{background:#f8fafc}.qty-input{width:76px;height:34px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:19px;font-weight:800}.qty-unit{font-size:13px;font-weight:600;color:var(--muted)}.badge{display:inline-block;font-size:12px;padding:4px 7px;border-radius:6px;background:#ecfdf5;color:var(--good);margin-top:10px}.badge.warn{background:#fff7ed;color:var(--warn)}.badge.scrap{background:#fef2f2;color:var(--scrap)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111827;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.22);font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(15,23,42,.28);padding:18px}.modal[hidden]{display:none}.modal-card{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 24px 70px rgba(15,23,42,.22)}.modal-title{font-size:16px;font-weight:900;margin-bottom:10px}.modal-input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font-size:15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.modal-btn{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.modal-btn.primary{background:#111827;border-color:#111827;color:#fff}
@media(max-width:900px){.app{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:700px){.wrap{padding:12px}.brand h1{font-size:19px}.app{display:block;padding:12px}.sidebar{position:static;max-height:none;margin-bottom:12px}.drop-list{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr;gap:12px}}
@media print{header{position:static}.sidebar{display:none}.app{display:block}.grid{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><h1 id="siteTitle">RF Inventory</h1><div class="brand-actions"><button id="langToggle" class="lang-btn" type="button">English</button><div class="count" id="count"></div></div></div></div></header>
<main class="app">
  <aside class="sidebar">
    <div class="side-heading"><div class="side-title" id="categoriesTitle">分类</div><div class="side-actions"><button class="side-action" id="addCategory" type="button" title="新增分类">+</button><button class="side-action" id="renameCategory" type="button" title="重命名选中的分类">改</button><button class="side-action" id="removeCategory" type="button" title="删除选中的分类">-</button></div></div><div id="categoryZones" class="drop-list"></div>
    <div class="hint" id="dragHint">拖动右侧物品图片到左侧对应的货位或分类，即可更新。数量也可直接修改；所有修改仅保存在当前浏览器中。</div>
  </aside>
  <section class="content"><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>没有匹配的库存记录</div></section>
</main>
<div class="footer" id="footerText">RF Inventory · 离线单页库存清单；照片和数据均已嵌入。</div><div id="toast" class="toast"></div><div id="editDialog" class="modal" hidden><div class="modal-card"><div class="modal-title" id="dialogTitle">修改</div><input id="dialogInput" class="modal-input" autocomplete="off"><div class="modal-actions"><button id="dialogCancel" class="modal-btn" type="button">取消</button><button id="dialogSave" class="modal-btn primary" type="button">保存</button></div></div></div>

<script>
(function(){
  var dataScript = document.createElement('script');
  dataScript.src = './RF_Inventory_Current_data.js';
  dataScript.onload = function(){
    var appScript = document.createElement('script');
    appScript.src = './RF_Inventory_Current_app.js';
    document.head.appendChild(appScript);
  };
  dataScript.onerror = function(){
    var fallback = document.createElement('div');
    fallback.style.cssText = 'padding:24px;font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;color:#1f2937';
    fallback.textContent = '库存数据暂时无法加载，请确认这三个文件都放在同一个文件夹里：RF_Inventory_Current.html、RF_Inventory_Current_data_full.js、RF_Inventory_Current_data_mobile.js。';
    document.body.innerHTML = '';
    document.body.appendChild(fallback);
  };
  document.head.appendChild(dataScript);
})();
</script>
</body>
</html>
